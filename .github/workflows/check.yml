name: Check archive
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Find duplicate candidates
        run: python3 scripts/data.py duplicates --all --output work/duplicate-candidates.md
      - name: Attach duplicate review summary
        if: always()
        run: |
          if [ -f work/duplicate-candidates.md ]; then
            head -c 8000 work/duplicate-candidates.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n\nFull report: download the duplicate-review artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duplicate-review
          path: work/duplicate-candidates.md
          if-no-files-found: ignore
      - run: npm run data:validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: colorado-sar-site-and-data
          path: dist/client/
